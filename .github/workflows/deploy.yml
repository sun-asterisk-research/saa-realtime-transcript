name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - production
          - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  supabase-migrate:
    name: Supabase Migrate
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          cd packages/supabase
          supabase link --project-ref $SUPABASE_PROJECT_ID
          supabase db push

  build-image:
    name: Build Container Images
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor registry
        uses: docker/login-action@v3
        with:
          registry: harbor.sun-asterisk.vn
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Image metadata
        id: image_metadata
        uses: docker/metadata-action@v5
        env:
          ENV_PREFIX: ${{ (github.event.inputs.environment || 'production') == 'production' && 'stable-' || '{{branch}}-' }}
        with:
          sep-tags: ","
          sep-labels: ","
          sep-annotations: ","
          tags: |
            type=raw,value={{date 'YYYY.MM.DD' tz='Asia/Ho_Chi_Minh'}},prefix=${{ env.ENV_PREFIX }},suffix=-gha.r${{github.run_number}}

      - name: Build and push image
        uses: docker/bake-action@v5
        env:
          REGISTRY: harbor.sun-asterisk.vn
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.image_metadata.outputs.bake-file }}
          targets: default
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
