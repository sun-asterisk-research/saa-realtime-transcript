{{- define "meeting-trans-poc.realtime.envCM" -}}
LOG_LEVEL: {{ .Values.config.realtime.logLevel | quote }}
PORT: "3000"
IDLE_TIMEOUT_MS: {{ .Values.config.realtime.idleTimeoutMs | quote }}
SUPABASE_URL: {{ .Values.supabase.url | quote }}
{{- end -}}

{{- include "tplchart.configMap" (dict
  "Args" (dict
    "nameTemplate" "%s-realtime"
    "data" (include "meeting-trans-poc.realtime.envCM" .)
  )
  "context" .
) -}}
